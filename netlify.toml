[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# ---- API redirects → Netlify Functions ----
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/customers"
  to = "/.netlify/functions/customers"
  status = 200
  force = true

[[redirects]]
  from = "/api/customers/*"
  to = "/.netlify/functions/customers"
  status = 200
  force = true

[[redirects]]
  from = "/api/payments"
  to = "/.netlify/functions/payments"
  status = 200
  force = true

[[redirects]]
  from = "/api/payments/*"
  to = "/.netlify/functions/payments"
  status = 200
  force = true

[[redirects]]
  from = "/api/photos"
  to = "/.netlify/functions/photos"
  status = 200
  force = true

[[redirects]]
  from = "/api/photos/*"
  to = "/.netlify/functions/photos"
  status = 200
  force = true

[[redirects]]
  from = "/api/walogs"
  to = "/.netlify/functions/walogs"
  status = 200
  force = true

[[redirects]]
  from = "/api/walogs/*"
  to = "/.netlify/functions/walogs"
  status = 200
  force = true

[[redirects]]
  from = "/api/seed"
  to = "/.netlify/functions/seed"
  status = 200
  force = true

[[redirects]]
  from = "/api/seed/*"
  to = "/.netlify/functions/seed"
  status = 200
  force = true

# ---- Catch-all: SPA fallback ----
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
